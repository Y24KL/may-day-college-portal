name: Database backup

on:
  schedule:
    - cron: "30 1 * * *" # 02:30 Lagos, daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client (must be ≥ the Neon server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Back up, encrypt and upload to R2
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET || 'maydaycollege-files' }}
        run: ./scripts/ops/backup-db.sh
      - name: Alert administrators on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO: ${{ vars.ADMIN_ALERT_EMAIL }}
          FROM: ${{ vars.EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Database backup FAILED"
          if [ -n "$RESEND_API_KEY" ] && [ -n "$TO" ]; then
            curl -fsS https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
              -d "{\"from\":\"${FROM:-alerts@maydaycollege.com.ng}\",\"to\":[\"$TO\"],\"subject\":\"[May Day College] Database backup FAILED\",\"text\":\"The scheduled database backup failed. Details: $RUN_URL\"}"
          fi
